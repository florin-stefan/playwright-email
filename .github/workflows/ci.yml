name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache Mailpit binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/playwright-email
            ~/AppData/Local/playwright-email
          key: mailpit-${{ runner.os }}-v1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: Install Chromium (used by e2e and example tests)
        run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run test:example
